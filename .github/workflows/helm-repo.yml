name: helm-repo

on:
  pull_request:
    paths:
      - ".github/workflows/helm-repo.yml"
      - "Makefile"
      - "artifacthub-repo.yml"
      - "index.html"
      - "logo.svg"
      - "charts/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/helm-repo.yml"
      - "Makefile"
      - "artifacthub-repo.yml"
      - "index.html"
      - "logo.svg"
      - "charts/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.0
      - name: Build and verify Helm repository
        run: make verify
      - name: Configure Git
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Sync chart index metadata
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          worktree="$(mktemp -d)"
          create_branch=0
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add -B gh-pages "$worktree" origin/gh-pages
          else
            create_branch=1
            git worktree add --detach "$worktree"
          fi
          cd "$worktree"
          if [ "$create_branch" = 1 ]; then
            git switch --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
          fi
          cp "$GITHUB_WORKSPACE"/artifacthub-repo.yml .
          cp "$GITHUB_WORKSPACE"/index.html .
          cp "$GITHUB_WORKSPACE"/logo.svg .
          cp "$GITHUB_WORKSPACE"/README.md .
          touch .nojekyll
          git add .nojekyll README.md artifacthub-repo.yml index.html logo.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: sync helm repo metadata"
          git push origin HEAD:gh-pages
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify Operator image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          version="$(helm show chart charts/soha-operator | awk '$1 == "appVersion:" { gsub(/"/, "", $2); print $2 }')"
          test -n "${version}"
          docker manifest inspect "ghcr.io/opensoha/soha-operator:${version}" >/dev/null
      - name: Release Helm charts
        if: github.event_name != 'pull_request'
        uses: helm/chart-releaser-action@v1.7.0
        with:
          skip_existing: true
          pages_branch: gh-pages
          mark_as_latest: false
        env:
          CR_TOKEN: ${{ github.token }}
      - name: Publish Helm charts as OCI artifacts
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for package in .cr-release-packages/*.tgz; do
            name="$(helm show chart "${package}" | awk '$1 == "name:" { print $2 }')"
            version="$(helm show chart "${package}" | awk '$1 == "version:" { print $2 }')"
            reference="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/${name}"
            if helm show chart "${reference}" --version "${version}" >/dev/null 2>&1; then
              echo "${name} ${version} already exists in GHCR"
              continue
            fi
            helm push "${package}" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
          done
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Checkout published chart repository
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: .pages
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages
      - name: Deploy GitHub Pages
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          GITHUB_TOKEN: ${{ github.token }}

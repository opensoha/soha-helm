apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "soha-agent.fullname" . }}
  labels:
    {{- include "soha-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "soha-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | quote }}
      labels:
        {{- include "soha-agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: opensoha
    spec:
      serviceAccountName: {{ include "soha-agent.serviceAccountName" . }}
      automountServiceAccountToken: {{ ne .Values.mode "outpost" }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: soha-agent
          image: {{ include "soha-agent.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 18080
          env:
            - name: SOHA_AGENT_CONFIG_FILE
              value: /etc/soha-agent/agent.config.yaml
{{- if .Values.config.controlPlane.enabled }}
            - name: SOHA_AGENT_CONTROL_PLANE_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
{{- if .Values.secrets.controlPlaneBearerToken }}
                  name: {{ include "soha-agent.fullname" . }}-secrets
                  key: control-plane-bearer-token
{{- else }}
                  name: {{ required "secrets.controlPlaneExistingSecret.name is required when controlPlaneBearerToken is empty" .Values.secrets.controlPlaneExistingSecret.name }}
                  key: {{ required "secrets.controlPlaneExistingSecret.key is required when controlPlaneBearerToken is empty" .Values.secrets.controlPlaneExistingSecret.key }}
{{- end }}
{{- end }}
            - name: SOHA_AGENT_AUTH_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "soha-agent.fullname" . }}-secrets
                  key: agent-bearer-token
          volumeMounts:
            - name: config
              mountPath: /etc/soha-agent
              readOnly: true
            - name: state
              mountPath: /var/log/soha-agent
              subPath: logs
            - name: state
              mountPath: /var/lib/soha-agent
              subPath: data
          readinessProbe:
            httpGet:
              path: {{ ternary "/readyz" "/api/v1/healthz" (eq .Values.mode "outpost") }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "soha-agent.fullname" . }}-config
        - name: state
          {{- if and .Values.persistence.enabled (ne .Values.mode "outpost") }}
          persistentVolumeClaim:
            claimName: {{ include "soha-agent.fullname" . }}-state
          {{- else }}
          emptyDir: {}
          {{- end }}

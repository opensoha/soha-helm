{{- $allowedActions := include "soha-agent.allowedActions" . | fromJsonArray -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "soha-agent.serviceAccountName" . }}
  labels:
    {{- include "soha-agent.labels" . | nindent 4 }}
{{- end }}
{{- if and .Values.rbac.create (ne .Values.mode "outpost") }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "soha-agent.clusterRoleName" . }}
  labels:
    {{- include "soha-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "endpoints", "events", "limitranges", "namespaces", "nodes", "persistentvolumeclaims", "persistentvolumes", "pods", "pods/log", "replicationcontrollers", "resourcequotas", "secrets", "serviceaccounts", "services"]
    verbs: ["get", "list", "watch"]
  {{- if has "platform.pods.exec" $allowedActions }}
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  {{- end }}
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "deployments/scale", "replicasets", "statefulsets", "statefulsets/scale"]
    verbs: ["get", "list", "watch"]
  {{- if or (has "platform.deployments.restart" $allowedActions) (has "platform.deployments.scale" $allowedActions) (has "platform.deployments.image" $allowedActions) (has "platform.deployments.rollback" $allowedActions) }}
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["update", "patch"]
  {{- end }}
  {{- if or (has "platform.statefulsets.restart" $allowedActions) (has "platform.statefulsets.scale" $allowedActions) }}
  - apiGroups: ["apps"]
    resources: ["statefulsets", "statefulsets/scale"]
    verbs: ["update", "patch"]
  {{- end }}
  {{- if has "platform.daemonsets.restart" $allowedActions }}
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["update", "patch"]
  {{- end }}
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses", "ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings", "clusterroles", "rolebindings", "roles"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["backendtlspolicies", "gatewayclasses", "gateways", "grpcroutes", "httproutes", "referencegrants", "tcproutes", "tlsroutes", "udproutes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews", "selfsubjectaccessreviews"]
    verbs: ["create"]
  {{- if has "platform.port_forwards.create" $allowedActions }}
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
  {{- end }}
  {{- if has "platform.nodes.drain" $allowedActions }}
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["update", "patch"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  {{- end }}
  {{- if has "platform.crds.delete" $allowedActions }}
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["delete"]
  {{- end }}
  {{- $writeVerbs := list }}
  {{- if has "platform.resources.create" $allowedActions }}{{- $writeVerbs = append $writeVerbs "create" }}{{- end }}
  {{- if has "platform.resources.apply" $allowedActions }}{{- $writeVerbs = concat $writeVerbs (list "update" "patch") }}{{- end }}
  {{- if has "platform.resources.delete" $allowedActions }}{{- $writeVerbs = append $writeVerbs "delete" }}{{- end }}
  {{- if $writeVerbs }}
  - apiGroups: [""]
    resources: ["configmaps", "limitranges", "namespaces", "nodes", "persistentvolumeclaims", "persistentvolumes", "pods", "replicationcontrollers", "resourcequotas", "secrets", "serviceaccounts", "services"]
    verbs: {{ $writeVerbs | toJson }}
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: {{ $writeVerbs | toJson }}
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: {{ $writeVerbs | toJson }}
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses", "ingresses", "networkpolicies"]
    verbs: {{ $writeVerbs | toJson }}
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: {{ $writeVerbs | toJson }}
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: {{ $writeVerbs | toJson }}
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    verbs: {{ $writeVerbs | toJson }}
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: {{ $writeVerbs | toJson }}
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings", "clusterroles", "rolebindings", "roles"]
    verbs: {{ $writeVerbs | toJson }}
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: {{ $writeVerbs | toJson }}
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: {{ $writeVerbs | toJson }}
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: {{ $writeVerbs | toJson }}
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["backendtlspolicies", "gatewayclasses", "gateways", "grpcroutes", "httproutes", "referencegrants", "tcproutes", "tlsroutes", "udproutes"]
    verbs: {{ $writeVerbs | toJson }}
  {{- end }}

  {{- range .Values.rbac.customResourceRules }}
  {{- if not .namespaces }}
  - apiGroups: [{{ .apiGroup | quote }}]
    resources: {{ .resources | toJson }}
    verbs: {{ .verbs | toJson }}
  {{- end }}
  {{- end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "soha-agent.fullname" . }}
  labels:
    {{- include "soha-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "soha-agent.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "soha-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

{{- if and .Values.rbac.create (ne .Values.mode "outpost") }}
{{- $root := . }}
{{- range $index, $rule := .Values.rbac.customResourceRules }}
{{- range $rule.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "soha-agent.fullname" $root }}-custom-{{ $index }}
  namespace: {{ . | quote }}
rules:
  - apiGroups: [{{ $rule.apiGroup | quote }}]
    resources: {{ $rule.resources | toJson }}
    verbs: {{ $rule.verbs | toJson }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "soha-agent.fullname" $root }}-custom-{{ $index }}
  namespace: {{ . | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "soha-agent.fullname" $root }}-custom-{{ $index }}
subjects:
  - kind: ServiceAccount
    name: {{ include "soha-agent.serviceAccountName" $root }}
    namespace: {{ $root.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}

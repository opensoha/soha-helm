{{- $secretName := printf "%s-secrets" (include "soha-agent.fullname" .) -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $existingAgentToken := "" -}}
{{- if and $existingSecret (hasKey $existingSecret.data "agent-bearer-token") -}}
{{- $existingAgentToken = index $existingSecret.data "agent-bearer-token" | b64dec -}}
{{- end -}}
{{- $agentToken := include "soha-agent.secretValue" (dict "value" .Values.secrets.agentBearerToken "existing" $existingAgentToken "length" 64) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "soha-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  agent-bearer-token: {{ $agentToken | quote }}
{{- with .Values.secrets.controlPlaneBearerToken }}
  control-plane-bearer-token: {{ . | quote }}
{{- end }}

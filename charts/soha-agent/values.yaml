image:
  repository: ghcr.io/opensoha/soha-agent
  tag: v0.1.12
  pullPolicy: IfNotPresent

mode: agent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
replicaCount: 1

service:
  type: ClusterIP
  port: 18080

rbac:
  create: true
  # Explicit CRD API groups/resources/verbs; namespaces scopes Role bindings.
  customResourceRules: []
  clusterRoleName: ""

serviceAccount:
  create: true
  name: ""

secrets:
  prometheusBearerToken: ""
  # Generated on first install when empty, then reused from the live Secret.
  agentBearerToken: ""
  # Used only when config.controlPlane.enabled is true and the token is managed here.
  controlPlaneBearerToken: ""
  # Used only when config.controlPlane.enabled is true. By default consume the runner token projected by the soha Chart.
  controlPlaneExistingSecret:
    name: soha-config
    key: execution-runner-token

config:
  appEnv: production
  loggerLevel: info
  loggerFormat: json
  allowedOrigins: []
  controlPlane:
    enabled: true
    baseUrl: https://soha.example.com
    agentId: production-agent
    runtimeEndpoint: http://soha-agent.soha-agent.svc.cluster.local:18080
    pollInterval: 5s
    maxConcurrency: 2
    defaultTimeout: 30m
    providerKinds:
      - ci_agent_runner
    workspaceRoot: /var/lib/soha-agent
    docker:
      enabled: false
      workerId: ""
      hostIds: []
      operationKinds: []
      composeRoot: /var/lib/soha-agent/docker
      pollInterval: 5s
    agentRuntime:
      enabled: false
      workerId: ""
      providerIds: []
      providerKinds: []
      hermesCommand: hermes
      workspaceRoot: /var/lib/soha-agent/runtime
      pollInterval: 5s
      providers: {}
    outpost:
      agentId: production-outpost
      protocolVersion: v1
      trustKeyId: ""
      trustPublicKey: ""
      pollInterval: 5s
      heartbeatInterval: 15s
  kubernetes:
    enabled: true
    id: production-agent
    name: Production Agent
    region: production
    environment: production
    labels:
      provider: agent
      owner: platform
  prometheus:
    baseUrl: ""
  security:
    # auto and custom use the default workbench list when no array is supplied.
    # Use [] to deny actions. Opt into individual Helm mutations with an explicit list.
    profile: auto
    allowedActions: null

persistence:
  enabled: true
  storageSize: 10Gi
  storageClassName: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

podSecurityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "soha-observability.fullname" . }}-config
  labels:
    {{- include "soha-observability.labels" . | nindent 4 }}
data:
  otel.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      filelog:
        include:
{{- if .Values.collector.namespaceAllowlist }}
{{- range .Values.collector.namespaceAllowlist }}
          - /var/log/pods/{{ . }}_*/*/*.log
{{- end }}
{{- else }}
          - /var/log/pods/*/*/*.log
{{- end }}
        include_file_path: true
        start_at: end
        operators:
          - type: container
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 384
      resource:
        attributes:
          - key: k8s.cluster.name
            action: upsert
            value: {{ .Values.clusterId | quote }}
      batch: {}
    exporters:
      otlphttp/loki:
        endpoint: {{ include "soha-observability.lokiEndpoint" . | quote }}
{{- if or .Values.collector.destination.tenantId .Values.collector.destination.existingSecret }}
        headers:
{{- if .Values.collector.destination.tenantId }}
          X-Scope-OrgID: {{ .Values.collector.destination.tenantId | quote }}
{{- end }}
{{- if .Values.collector.destination.existingSecret }}
          Authorization: "Bearer ${env:LOKI_BEARER_TOKEN}"
{{- end }}
{{- end }}
    service:
      extensions: [health_check]
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, resource, batch]
          exporters: [otlphttp/loki]
{{- if eq .Values.profile "starter" }}
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /var/loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
    limits_config:
      allow_structured_metadata: true
      retention_period: {{ .Values.loki.retentionDays }}d
      otlp_config:
        resource_attributes:
          attributes_config:
            - action: index_label
              attributes:
                - k8s.cluster.name
                - k8s.namespace.name
                - k8s.pod.name
                - k8s.container.name
                - service.name
{{- end }}

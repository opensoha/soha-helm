profile: starter
workspaceId: default
clusterId: default
environment: ""
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

collector:
  enabled: true
  podLogGroupId: 0
  signalAllowlist:
    - logs
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.157.0
    pullPolicy: IfNotPresent
  namespaceAllowlist: []
  otlp:
    enabled: false
    existingSecret: ""
  destination:
    endpoint: ""
    tenantId: ""
    existingSecret: ""
  metrics:
    endpoint: ""
    existingSecret: ""
  traces:
    endpoint: ""
    existingSecret: ""
    insecure: false
  redaction:
    deleteAttributes:
      - db.connection_string
      - http.request.header.authorization
      - http.request.header.cookie
      - http.response.header.set-cookie
      - url.full
    hashAttributes:
      - enduser.id
      - user.id
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

loki:
  enabled: true
  image:
    repository: grafana/loki
    tag: 3.7.4
    pullPolicy: IfNotPresent
  retentionDays: 7
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

persistence:
  enabled: true
  storageClassName: ""
  storageSize: 10Gi

nodeSelector: {}
tolerations: []
affinity: {}

profile: starter
clusterId: default
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

collector:
  enabled: true
  podLogGroupId: 0
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.157.0
    pullPolicy: IfNotPresent
  namespaceAllowlist: []
  destination:
    endpoint: ""
    tenantId: ""
    existingSecret: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

loki:
  enabled: true
  image:
    repository: grafana/loki
    tag: 3.7.4
    pullPolicy: IfNotPresent
  retentionDays: 7
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

persistence:
  enabled: true
  storageClassName: ""
  storageSize: 10Gi

nodeSelector: {}
tolerations: []
affinity: {}

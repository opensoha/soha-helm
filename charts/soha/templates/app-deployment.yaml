{{- if and .Values.dshRuntime.enabled (not .Values.dshRuntime.allowInsecureHTTP) (not (hasPrefix "https://" .Values.dshRuntime.baseURL)) }}
{{- fail "dshRuntime requires HTTPS baseURL or explicit allowInsecureHTTP=true for an isolated private service network" }}
{{- end }}
{{- if and .Values.dshRuntime.enabled (not .Values.config.security.protectedDurableStorage) }}
{{- fail "dshRuntime requires config.security.protectedDurableStorage=true after all Core workers support encrypted checkpoints" }}
{{- end }}
{{- $coreImage := include "soha.image" . }}
{{- if and (or .Values.dshRuntime.enabled .Values.hindsight.enabled) (regexMatch "^ghcr[.]io/opensoha/soha:v?0[.]1[.]12(@sha256:.*)?$" $coreImage) }}
{{- fail "dshRuntime and Hindsight require a compatible Core image; set image.repository and image.tag to the validated runtime-compatible Core image" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "soha.fullname" . }}
  labels:
    {{- include "soha.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: app
      {{- include "soha.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include "soha.appConfigChecksum" . | quote }}
      labels:
        app.kubernetes.io/component: app
        {{- include "soha.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.appHostingDynamic.enabled }}
      serviceAccountName: {{ printf "%s-app-hosting" (include "soha.fullname" . | trunc 50 | trimSuffix "-") }}
      automountServiceAccountToken: true
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if or .Values.postgres.enabled .Values.config.networkIngestQuery.enabled }}
      initContainers:
        {{- if .Values.postgres.enabled }}
        - name: wait-for-postgres
          image: {{ .Values.postgres.image | quote }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            - pg_isready
            - {{ printf "--host=%s" (include "soha.postgresServiceName" .) | quote }}
            - {{ printf "--port=%v" .Values.postgres.port | quote }}
            - {{ printf "--username=%s" .Values.postgres.username | quote }}
            - {{ printf "--dbname=%s" .Values.postgres.database | quote }}
        {{- end }}
        {{- if .Values.config.networkIngestQuery.enabled }}
        - name: prepare-query-tls
          image: {{ include "soha.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml (mergeOverwrite (deepCopy .Values.securityContext) (dict "readOnlyRootFilesystem" true)) | nindent 12 }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              umask 077
              mkdir -p /private/query
              chmod 0700 /private/query
              for key in ca.crt tls.crt tls.key; do
                test -s "/secret-source/$key"
                cp "/secret-source/$key" "/private/query/$key"
                chmod 0600 "/private/query/$key"
              done
          volumeMounts:
            - name: network-ingest-query-tls-source
              mountPath: /secret-source
              readOnly: true
            - name: network-ingest-query-tls
              mountPath: /private
        {{- end }}
      {{- end }}
      containers:
        - name: soha
          image: {{ $coreImage | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: SOHA_CONFIG_FILE
              value: /app/configs/config.yaml
            {{- if .Values.postgres.existingCASecret }}
            - name: PGSSLROOTCERT
              value: /run/soha-postgres/ca.crt
            {{- end }}
            {{- if .Values.outpostExecutor.enabled }}
            - name: SOHA_OUTPOST_SIGNING_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.outpostExecutor.signingKey.existingSecret | quote }}
                  key: {{ .Values.outpostExecutor.signingKey.key | quote }}
            {{- end }}
            {{- if .Values.dshRuntime.enabled }}
            - {name: SOHA_DSH_RUNTIME_ENABLED, value: "true"}
            - {name: SOHA_DSH_RUNTIME_BASE_URL, value: {{ default (printf "http://%s:8097" (include "soha.dshName" .)) .Values.dshRuntime.baseURL | quote }}}
            - {name: SOHA_DSH_RUNTIME_SERVICE_TOKEN_FILE, value: /run/soha-dsh/service-token}
            - {name: SOHA_DSH_RUNTIME_TIMEOUT, value: {{ .Values.dshRuntime.timeout | quote }}}
            - {name: SOHA_DSH_RUNTIME_ALLOW_INSECURE_HTTP, value: {{ .Values.dshRuntime.allowInsecureHTTP | quote }}}
            {{- end }}
            {{- if .Values.hindsight.enabled }}
            - {name: SOHA_HINDSIGHT_ENABLED, value: "true"}
            - {name: SOHA_HINDSIGHT_BASE_URL, value: {{ default (printf "http://%s:8889" (include "soha.hindsightName" .)) .Values.hindsight.baseURL | quote }}}
            - {name: SOHA_HINDSIGHT_TOKEN_FILE, value: /run/soha-hindsight/service-token}
            - {name: SOHA_HINDSIGHT_INSTANCE_NAMESPACE, value: {{ .Values.hindsight.instanceNamespace | quote }}}
            - {name: SOHA_HINDSIGHT_TIMEOUT, value: {{ .Values.hindsight.timeout | quote }}}
            {{- end }}
            {{- if .Values.appHostingDynamic.enabled }}
            {{- $h := .Values.appHostingDynamic }}
            - {name: SOHA_APP_HOSTING_RUNTIME_NAMESPACE, value: {{ $h.runtimeNamespace | quote }}}
            - {name: SOHA_APP_HOSTING_BUILD_NAMESPACE, value: {{ $h.buildNamespace | quote }}}
            - {name: SOHA_APP_HOSTING_BUILD_CLIENT_IMAGE, value: {{ $h.buildClientImage | quote }}}
            - {name: SOHA_APP_HOSTING_NODE_BASE_IMAGE, value: {{ $h.nodeBaseImage | quote }}}
            - {name: SOHA_APP_HOSTING_PYTHON_BASE_IMAGE, value: {{ $h.pythonBaseImage | quote }}}
            - {name: SOHA_APP_HOSTING_REGISTRY_REPOSITORY, value: {{ $h.registryRepository | quote }}}
            - {name: SOHA_APP_HOSTING_BUILD_REGISTRY_SECRET, value: {{ $h.buildRegistrySecret | quote }}}
            - {name: SOHA_APP_HOSTING_BUILDKIT_ADDRESS, value: {{ $h.buildkitAddress | quote }}}
            - {name: SOHA_APP_HOSTING_BUILDKIT_TLS_SECRET, value: {{ $h.buildkitTLSSecret | quote }}}
            - {name: SOHA_APP_HOSTING_BUILD_SOURCE_ORIGIN, value: {{ $h.buildSourceOrigin | quote }}}
            {{- if trim (default "" $h.buildRuntimeClass) }}
            - {name: SOHA_APP_HOSTING_BUILD_RUNTIME_CLASS, value: {{ $h.buildRuntimeClass | quote }}}
            {{- end }}
            - name: SOHA_APP_HOSTING_APP_DATA_ADMIN_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ $h.appDataExistingSecret | quote }}
                  key: {{ $h.dsnKey | quote }}
            - name: SOHA_APP_HOSTING_APP_DATA_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $h.appDataExistingSecret | quote }}
                  key: {{ $h.keyKey | quote }}
            - {name: SOHA_APP_HOSTING_APP_DATA_MAX_POOL_BYTES, value: {{ printf "%d" (int64 $h.maxPoolBytes) | quote }}}
            {{- end }}
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.postgres.existingCASecret }}
            - name: postgres-ca
              mountPath: /run/soha-postgres
              readOnly: true
            {{- end }}
            {{- if .Values.proxyExecutor.enabled }}
            - name: proxy-executor-token
              mountPath: /var/run/soha-proxy-executor
              readOnly: true
            {{- end }}
            {{- if .Values.radiusExecutor.enabled }}
            - name: radius-executor-token
              mountPath: /var/run/soha-radius-executor
              readOnly: true
            {{- end }}
            - name: app-config
              mountPath: /app/configs/config.yaml
              subPath: config.yaml
              readOnly: true
            {{- if .Values.outpostExecutor.enabled }}
            - name: outpost-executor-token
              mountPath: /var/run/soha-outpost-executor
              readOnly: true
            {{- end }}
            {{- if .Values.dshRuntime.enabled }}
            - {name: dsh-runtime-token, mountPath: /run/soha-dsh, readOnly: true}
            {{- end }}
            {{- if .Values.hindsight.enabled }}
            - {name: hindsight-token, mountPath: /run/soha-hindsight, readOnly: true}
            {{- end }}
            {{- if .Values.config.networkIngestQuery.enabled }}
            - name: network-ingest-query-tls
              mountPath: /run/soha-network-ingest-query
              subPath: query
              readOnly: true
            {{- end }}
            {{- if .Values.persistence.enabled }}
            - name: app-data
              mountPath: /app/data
            {{- end }}
      volumes:
        {{- if .Values.postgres.existingCASecret }}
        - name: postgres-ca
          secret:
            secretName: {{ .Values.postgres.existingCASecret | quote }}
            items: [{key: {{ .Values.postgres.caKey | quote }}, path: ca.crt}]
        {{- end }}
        {{- if .Values.proxyExecutor.enabled }}
        - name: proxy-executor-token
          secret:
            secretName: {{ .Values.proxyExecutor.existingTokenSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.proxyExecutor.tokenKey | quote }}
                path: token
        {{- end }}
        {{- if .Values.radiusExecutor.enabled }}
        - name: radius-executor-token
          secret:
            secretName: {{ .Values.radiusExecutor.existingTokenSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.radiusExecutor.tokenKey | quote }}
                path: token
        {{- end }}
        - name: app-config
          secret:
            secretName: {{ include "soha.fullname" . }}-config
        {{- if .Values.outpostExecutor.enabled }}
        - name: outpost-executor-token
          secret:
            secretName: {{ .Values.outpostExecutor.existingTokenSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.outpostExecutor.tokenKey | quote }}
                path: token
        {{- end }}
        {{- if .Values.dshRuntime.enabled }}
        - name: dsh-runtime-token
          secret:
            secretName: {{ .Values.dshRuntime.existingSecret | quote }}
            defaultMode: 0440
            items: [{key: service-token, path: service-token}]
        {{- end }}
        {{- if .Values.hindsight.enabled }}
        - name: hindsight-token
          secret:
            secretName: {{ .Values.hindsight.existingSecret | quote }}
            defaultMode: 0440
            items: [{key: service-token, path: service-token}]
        {{- end }}
        {{- if .Values.config.networkIngestQuery.enabled }}
        - name: network-ingest-query-tls
          emptyDir:
            medium: Memory
        - name: network-ingest-query-tls-source
          secret:
            secretName: {{ .Values.config.networkIngestQuery.existingSecret | quote }}
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca.crt
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: app-data
          persistentVolumeClaim:
            claimName: {{ include "soha.persistenceClaimName" . }}
        {{- end }}

          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: SOHA_CONFIG_FILE
              value: /app/configs/config.yaml
            - name: SOHA_INGEST_DATABASE_HOST
              value: {{ include "soha.ingestPostgresName" . | quote }}
            - name: SOHA_INGEST_DATABASE_PORT
              value: "5432"
            - name: SOHA_INGEST_DATABASE_NAME
              value: {{ .Values.networkRuntime.ingestPostgres.database | quote }}
            - name: SOHA_INGEST_DATABASE_USER
              value: {{ .Values.networkRuntime.ingestPostgres.username | quote }}
            - name: SOHA_INGEST_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "soha.fullname" . }}-config
                  key: ingest-postgres-password
            - name: SOHA_INGEST_TLS_CERT_FILE
              value: /run/soha-ingest/tls.crt
            - name: SOHA_INGEST_TLS_KEY_FILE
              value: /run/soha-ingest/tls.key
            - name: SOHA_INGEST_TLS_CLIENT_CA_FILE
              value: /run/soha-ingest/client-ca.crt
          ports:
            - containerPort: 8083
              name: https
          startupProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /readyz
              port: https
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: app-config
              mountPath: /app/configs/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: runtime-tls
              mountPath: /run/soha-ingest
              readOnly: true
      volumes:
        - name: app-config
          secret:
            secretName: {{ include "soha.fullname" . }}-config
        - name: runtime-tls
          secret:
            secretName: {{ .Values.networkRuntime.existingTLSSecret | quote }}
            defaultMode: 0440
            items:
              - key: ingest.crt
                path: tls.crt
              - key: ingest.key
                path: tls.key
              - key: client-ca.crt
                path: client-ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "soha.ingestName" . }}
  labels:
    {{- include "soha.labels" . | nindent 4 }}
spec:
  type: {{ .Values.networkRuntime.ingest.service.type }}
  selector:
    app.kubernetes.io/component: network-ingest
    {{- include "soha.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: {{ .Values.networkRuntime.ingest.service.port }}
      targetPort: https
{{- end }}

  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: network-ingest
      {{- include "soha.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include "soha.appConfigChecksum" . | quote }}
      labels:
        app.kubernetes.io/component: network-ingest
        {{- include "soha.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ingest
          image: {{ include "soha.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:

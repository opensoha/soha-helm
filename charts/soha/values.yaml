image:
  repository: ghcr.io/opensoha/soha
  tag: v0.1.6
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
replicaCount: 1

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  annotations: {}
  host: soha.example.com
  tls: false
  tlsSecretName: ""

postgres:
  enabled: true
  # PostgreSQL 18 stores PGDATA below /var/lib/postgresql/18/docker.
  # Keep the persistent volume mounted at /var/lib/postgresql in templates.
  image: pgvector/pgvector:0.8.5-pg18-trixie
  database: soha
  username: pgsql
  host: ""
  port: 5432
  # Standard initial credential. Existing live Secret values win on upgrades.
  password: pgsql
  storageSize: 10Gi

config:
  # These values are rendered into the control-plane config.yaml. Changing the
  # rendered file with helm upgrade rolls the control-plane Pods.
  loggerLevel: info
  loggerFormat: json
  basePath: /api/v1
  idleTimeout: 120s
  maxHeaderBytes: 1048576
  # Trust only explicit ingress/reverse-proxy IPs or CIDRs. Empty disables
  # forwarded client IP headers.
  trustedProxies: []
  corsAllowedOrigins:
    - https://soha.example.com
  runtime:
    # Public project default. Override before exposing a deployment.
    executionRunnerToken: soha-123456789012345678901234567890
  auth:
    enableDevAuth: false
    adminUserId: 67d90df8-9de4-4a7b-b3f8-86cd36f899e2
    adminName: OpenSoha
    adminEmail: opensoha@soha.local
    # Standard initial credential. Existing live Secret values win on upgrades.
    adminPassword: opensoha
    adminRoles:
      - admin
      - ops
      - auditor
    jwtIssuer: soha
    # Public project default. Override before exposing a deployment.
    jwtSecret: soha-123456789012345678901234567890
    accessTTL: 15m
    refreshTTL: 168h
  monitoring:
    enabled: true
    # Public project default. Override before exposing a deployment.
    webhookToken: soha-123456789012345678901234567890
  modules:
    # Module and feature values are startup configuration for the packaged image.
    delivery:
      enabled: true
    monitoring:
      enabled: true
    ai:
      enabled: true
      features:
        globalAssistant: true
    aiGateway:
      enabled: true
    virtualization:
      enabled: false
    docker:
      enabled: true
    security:
      enabled: false
    cmdb:
      enabled: false
  swaggerEnabled: false
  mcpEnabled: true
  aiGateway:
    rateLimit:
      backend: postgres
      redis:
        addr: ""
        username: ""
        password: ""
        db: 0
        tls: false
        keyPrefix: soha:ai-gateway:rate-limit
        timeout: 500ms
  seedDefaults: true
  security:
    # Public project default. Override before storing production credentials.
    # Changing this key requires migrating data encrypted with the old key.
    # Keep this value identical across all control-plane replicas.
    credentialEncryptionKey: soha-123456789012345678901234567890
    secretProvider: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 1Gi

podSecurityContext:
  runAsUser: 10001
  runAsGroup: 10001
  runAsNonRoot: true
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

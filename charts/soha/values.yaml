image:
  repository: ghcr.io/opensoha/soha
  tag: v0.1.12
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
replicaCount: 1

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  annotations: {}
  host: soha.example.com
  tls: false
  tlsSecretName: ""

postgres:
  enabled: true
  # PostgreSQL 18 stores PGDATA below /var/lib/postgresql/18/docker.
  # Keep the persistent volume mounted at /var/lib/postgresql in templates.
  image: pgvector/pgvector:0.8.5-pg18-trixie
  database: soha
  username: pgsql
  host: ""
  port: 5432
  sslMode: disable
  # Optional CA for external PostgreSQL; existing Secret key defaults to ca.crt.
  existingCASecret: ""
  caKey: ca.crt
  # Standard initial credential. Existing live Secret values win on upgrades.
  password: pgsql
  storageSize: 10Gi

networkRuntime:
  # Runs network-control and high-frequency ingest outside the core Pod.
  enabled: false
  # Existing Secret keys: network-control.crt, network-control.key,
  # ingest.crt, ingest.key, and client-ca.crt.
  existingTLSSecret: ""
  control:
    service:
      type: LoadBalancer
      port: 8082
  ingest:
    service:
      type: LoadBalancer
      port: 8083
  ingestPostgres:
    image: pgvector/pgvector:0.8.5-pg18-trixie
    database: soha_ingest
    username: pgsql
    # Standard initial credential. Existing live Secret values win on upgrades.
    password: pgsql
    storageClass: ""
    storageSize: 10Gi

config:
  # These values are rendered into the control-plane config.yaml. Changing the
  # rendered file with helm upgrade rolls the control-plane Pods.
  loggerLevel: info
  loggerFormat: json
  basePath: /api/v1
  idleTimeout: 120s
  maxHeaderBytes: 1048576
  # Trust only explicit ingress/reverse-proxy IPs or CIDRs. Empty disables
  # forwarded client IP headers.
  trustedProxies: []
  corsAllowedOrigins:
    - https://soha.example.com
  runtime:
    # Public project default. Override before exposing a deployment.
    executionRunnerToken: soha-123456789012345678901234567890
  auth:
    # Enable only with a verified Core + Web + CLI v2 combination.
    cli:
      enabled: false
      publicURL: ""
      allowPassword: true
      deviceTTL: 5m
      pollInterval: 5s
      accessTTL: 15m
      idleTTL: 168h
      absoluteTTL: 720h
      createLimit: 10
      sourcePendingLimit: 5
      activeGrantLimit: 1000
      sourceAttemptLimit: 20
      userAttemptLimit: 5
    enableDevAuth: false
    adminUserId: 67d90df8-9de4-4a7b-b3f8-86cd36f899e2
    adminName: OpenSoha
    adminEmail: opensoha@soha.local
    # Standard initial credential. Existing live Secret values win on upgrades.
    adminPassword: opensoha
    adminRoles:
      - admin
      - ops
      - auditor
    jwtIssuer: soha
    # Initial installation value. Existing live Secret identity wins on upgrades.
    jwtSecret: soha-123456789012345678901234567890
    accessTTL: 15m
    refreshTTL: 168h
  monitoring:
    enabled: true
    # Public project default. Override before exposing a deployment.
    webhookToken: soha-123456789012345678901234567890
  networkIngestQuery:
    enabled: false
    url: ""
    serverName: ""
    existingSecret: ""
    timeout: 5s
    maxResponseBytes: 1048576
  modules:
    # Module and feature values are startup configuration for the packaged image.
    delivery:
      enabled: true
    monitoring:
      enabled: true
    ai:
      enabled: true
      features:
        globalAssistant: true
    aiGateway:
      enabled: true
    virtualization:
      enabled: false
    docker:
      enabled: true
    security:
      enabled: false
    cmdb:
      enabled: false
  swaggerEnabled: false
  mcpEnabled: true
  aiGateway:
    rateLimit:
      backend: postgres
      redis:
        addr: ""
        username: ""
        password: ""
        db: 0
        tls: false
        keyPrefix: soha:ai-gateway:rate-limit
        timeout: 500ms
  seedDefaults: true
  security:
    # Public project default. Override before storing production credentials.
    # Changing this key requires migrating data encrypted with the old key.
    # Keep this value identical across all control-plane replicas.
    credentialEncryptionKey: soha-123456789012345678901234567890
    # Enable after all Core workers support encrypted checkpoints. Required by dsh.
    protectedDurableStorage: false
    secretProvider: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 1Gi

podSecurityContext:
  runAsUser: 10001
  runAsGroup: 10001
  runAsNonRoot: true
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Disabled for core-only installs. Requires a newly built Core image containing
# /app/outpost-runtime-executor and a dedicated installer-provisioned token.
outpostExecutor:
  enabled: false
  # Set true only after the admission policy is installed and verified.
  start: false
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  controlPlaneUrl: ""
  executorId: ""
  existingTokenSecret: ""
  tokenKey: token
  # Existing Ed25519 signing material only; never place private key bytes here.
  # Core expands its private-key environment reference from this Secret.
  signingKey:
    keyId: ""
    existingSecret: ""
    key: private-key
  slots: []

# Independent data plane; never starts in a core-only installation.
proxyRuntime:
  enabled: false
  name: soha-proxy
  replicas: 0
  image: ""
  engine: mihomo
  engineBinary: /mihomo
  existingProbeProfilesSecret: ""
  controlUrl: ""
  ingestUrl: ""
  endpointId: ""
  # TLS passthrough LoadBalancer; certificate SAN must match the public hostname.
  serviceType: LoadBalancer
  storageClass: ""
  storageSize: 1Gi
  # Ordered ordinal -> independently enrolled runtime and Secret. See PROXY.md.
  members: []

proxyExecutor:
  enabled: false
  start: false
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  controlPlaneUrl: ""
  executorId: ""
  existingTokenSecret: ""
  tokenKey: token
  slots: []

# IDs only; runtime target URLs remain in installer-owned private profile files.
proxyProbeProfiles: []

# Optional Linux FreeRADIUS supervisor. Each ordinal PVC must be provisioned by
# the installer before enabling replicas; chart never creates approved material.
radiusRuntime:
  enabled: false
  name: soha-radius
  serviceAccount: soha-radius
  replicas: 0
  image: ""
  storageClass: ""
  storageSize: 1Gi
  # Ordered memberId/runtimeId/ordinal/endpoint/credentialRef; no private values.
  members: []

radiusExecutor:
  enabled: false
  start: false
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  baseUrl: ""
  executorId: ""
  existingTokenSecret: ""
  tokenKey: token
  slots: []

# Optional services and startup-only Core wiring; disabled means new chat unavailable, never native fallback.
dshRuntime:
  enabled: false
  # Supply a locally built and validated immutable image reference.
  image: ""
  existingSecret: "" # key: service-token (shared with Core)
  # Empty URLs derive from the Core Service, config.basePath and model/tool routes.
  gatewayURL: ""
  callbackURL: ""
  models: soha-workbench
  # Empty baseURL derives http://<fullname>-dsh:8097; opt into private HTTP explicitly.
  baseURL: ""
  timeout: 15s
  allowInsecureHTTP: false
  # Use the retained claim name here when reinstalling or taking over storage.
  existingClaim: ""
  storageSize: 5Gi
  storageClass: ""
  pluginAssets:
    configMap: "" # registry.json and optional Skill files
    skillFiles: {} # relative path under /run/dsh-skills -> ConfigMap key
    credentialSecret: "" # dedicated HTTP MCP Secret, exposed under /run/dsh-credentials
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "2", memory: 1Gi}

hindsight:
  enabled: false
  # Fixed 1.2.0 index digest; includes API + the deployment-only Python gateway.
  image: ghcr.io/vectorize-io/hindsight:1.2.0@sha256:19d0c08f3df79acac29384826419a1ca158129e81ec527cdcbd8c97ff4ef76da
  existingSecret: "" # keys: service-token (shared with Core), gateway-pat, database-url
  # Contains reviewed deploy/dsh-hindsight/{gateway.py,start.py} artifacts.
  deploymentConfigMap: ""
  gatewayURL: ""
  # Empty reuses gatewayURL; set a provider-specific URL for a separate embedding route.
  embeddingGatewayURL: ""
  llmModel: ""
  embeddingModel: ""
  embeddingDimensions: 0
  # Empty baseURL derives http://<fullname>-hindsight:8889.
  baseURL: ""
  timeout: 15s
  instanceNamespace: "" # stable, unique, server-owned; required when enabled
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}

# Optional Workspace App Hosting data-plane gateway; serves *.appsDomain and never runs inside Core.
appGateway:
  enabled: false
  replicas: 2
  # Optional image override (string "repo:tag" or repository/tag/pullPolicy map); defaults to the chart's main image.
  image:
    repository: ""
    tag: ""
    pullPolicy: ""
  appsDomain: ""
  publicScheme: https
  httpRedirectPort: 0
  publicCoreUrl: ""
  # Empty derives http://<fullname>:<service.port>.
  coreUrl: ""
  trustedProxies: []
  # 0s enforces strict per-request Core authorization checks so audience narrowing/revocation takes effect immediately across replicas.
  decisionCacheTtl: 0s
  # Required when enabled. Holds gateway-token and cookie-secret keys (32+ byte secret).
  existingSecret: ""
  gatewayTokenKey: gateway-token
  cookieSecretKey: cookie-secret
  secretRevision: ""
  tls:
    existingSecret: ""
    certKey: tls.crt
    keyKey: tls.key
  s3:
    endpoint: ""
    bucket: ""
    region: us-east-1
    prefix: ""
    pathStyle: true
    insecure: false
    # Required when enabled. Holds access-key-id and secret-access-key keys.
    existingSecret: ""
    accessKeyIdKey: access-key-id
    secretAccessKeyKey: secret-access-key
  service:
    type: ClusterIP
    port: 8090
  ingress:
    enabled: false
    className: ""
    annotations: {}
    tlsSecretName: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Optional dynamic App Hosting data plane (Knative runtime + BuildKit builds). Requires appGateway.
appHostingDynamic:
  enabled: false
  # Distinct, pre-existing namespaces owned by the Soha Operator; must not be the release namespace.
  runtimeNamespace: ""
  buildNamespace: ""
  clusterDomain: cluster.local
  # Pre-existing Secret in the release namespace consumed only by Core. dsnKey must grant
  # least-privilege access to the isolated app-data database; key encrypts app data.
  appDataExistingSecret: ""
  dsnKey: dsn
  keyKey: key
  # Required positive when enabled.
  maxPoolBytes: 0
  # Fixed IPv4 /32 App Data endpoint reachable from hosted apps.
  appDataCIDR: ""
  appDataPort: 5432
  # All route-entry Pods for the dedicated Knative installation, including the
  # cluster-local ingress and activator. The chart restricts their inbound traffic.
  knativePrivateIngress: []
  # Required image/config inputs provisioned by the Soha Operator when enabled.
  buildClientImage: ""
  nodeBaseImage: ""
  pythonBaseImage: ""
  registryRepository: ""
  buildRegistrySecret: ""
  buildkitAddress: ""
  buildkitTLSSecret: ""
  # Must be an HTTPS origin.
  buildSourceOrigin: ""
  # Optional RuntimeClass for build Jobs.
  buildRuntimeClass: ""
